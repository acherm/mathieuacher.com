# PhD students and postdocs (rendered on /service/, /service.md, and llms-full.txt).
#
# One [[person]] per position. Dates are "YYYY", "YYYY-MM", or "YYYY-MM-DD".
#   kind    = "phd" (I am director or co-supervisor), "associated" (PhD student I work with,
#             without being a supervisor), "postdoc"
