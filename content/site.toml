# Identity, navigation, profiles, and the texts used for meta tags and llms.txt.

[site]
url = "https://mathieuacher.com"
domain = "mathieuacher.com"
lang = "en"
blog = "https://blog.mathieuacher.com"
blog_about = "posts on software variability, coding agents and LLMs, programming languages, chess and AI, research, and teaching"
news_visible = 8         # news items shown before "Older news"
selected_visible = 14    # selected publications on the home page
description = "Mathieu Acher is Full Professor of Computer Science at INSA Rennes, member of the Institut Universitaire de France (IUF), and a researcher in the DiverSE team (Inria, IRISA). He works on software variability, configurable systems, reproducibility, and LLMs and coding agents for software engineering."

# Shown as the blockquote of /llms.txt: one dense paragraph a model can quote.
llms_summary = """
Mathieu Acher is a Full Professor of Computer Science at INSA Rennes (France), a member (sociétaire) of the Institut Universitaire de France (IUF), and a researcher in the DiverSE team (IRISA, Inria, CNRS, Université de Rennes). His research is on software variability: modelling, reverse engineering, testing, and learning highly configurable systems (feature models, software product lines, the Linux kernel, performance prediction, deep software variability), and on how large language models and coding agents change software engineering.
"""

# Free-form Markdown after the summary in /llms.txt.
llms_facts = """
Key facts:

- Full Professor at INSA Rennes since September 2022; researcher in the DiverSE team (Inria, IRISA) since 2012; Associate Professor at University of Rennes 1 (ISTIC) from 2012 to 2022; postdoc at the University of Namur (2011–2012).
- Member (sociétaire) of the Institut Universitaire de France (IUF), appointed junior member in 2021 on the chair in science outreach (Médiation scientifique).
- Recommended for the CNRS bronze medal by Section 6 of the CNRS National Committee (2023).
- Co-lead of the Inria challenge LLM4Code (2024–2028) and of the Inria–Simula associate team RIPOST (2024–2027); lead for DiverSE of the Inria–Mitsubishi Electric challenge FRAIME (since 2025); head of the variability engineering axis of DiverSE.
- Co-head of the research Master SIF (Rennes) since 2024.
- PhD (2011, University of Nice Sophia Antipolis) on managing multiple feature models (FAMILIAR language); HDR (2021, University of Rennes 1) on modelling, reverse engineering, and learning software variability.
- Awards: VARIABILITY 2026 Most Influential Paper, SCAM 2026 Distinguished Paper, ISSTA 2024 Distinguished Paper, AST 2024, MODELS 2023, ICSR 2022, SPLC 2021, and ICPE 2020 Best Paper, SLE 2019 Most Influential Paper, SPLC 2013 Best Student Paper.
- General chair of VaMoS 2025; member of the SPLC, VaMoS, and VARIABILITY steering committees.
- Chess: FIDE Master with three international master norms.
- Contact: mathieu.acher@irisa.fr. Affiliation used in papers: INSA Rennes, Université de Rennes, Inria, CNRS, IRISA (France).
"""

contact = """
The best way to reach me is by email: [mathieu.acher@irisa.fr](mailto:mathieu.acher@irisa.fr).

IRISA / Inria Rennes, Campus de Beaulieu, 35042 Rennes, France.
"""

