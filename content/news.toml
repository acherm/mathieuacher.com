text = "My panel [*The Constant*](https://www.sourcecode-exhibition.softwareheritage.org/the-constant/), on the number 1070372 that has stayed unchanged in Stockfish's source code since 2014, is part of the [Source Code Exhibition](https://www.sourcecode-exhibition.softwareheritage.org/) for the 10th anniversary of Software Heritage, unveiled at UNESCO in Paris and since shown at the Cité des sciences and Sorbonne Université."

