summary = """
I supervise PhD students, postdocs, and engineers in the DiverSE team, on variability, machine learning and LLMs for software engineering, reproducibility, and testing, often with industrial partners (CGI France, Sopra Steria, Airbus). I serve the software product line and variability community (SPLC and VaMoS steering committees, VaMoS 2025 general chair) and co-lead the Inria challenge LLM4Code and the Inria–Simula associate team RIPOST.
"""

committees = """
- **2026**: VARIABILITY (research papers)
- **2025**: ECAI, SPLC (main and challenge tracks), MODEVAR
- **2024**: SPLC, MODEVAR (also keynote at MODEVAR@VaMoS)
- **2023**: SPLC, VaMoS
- **2022**: MODEVAR
- **2021**: SPLC, VaMoS
- **2020**: ICSE (SEIP), SPLC, MODELS (doctoral symposium)
- **2019**: SPLC (research, demos and tools), VaMoS, ASE (journal first)
- **Earlier**: ASE 2018, ICSE NIER 2014, 2015, 2018, ICSE SEIP 2014, ICSR 2018, SPLC 2014–2018, VaMoS 2016–2018, SAC SE 2015–2018, SEAA, FOSD, REVE, and others ([full list until 2019](https://web.archive.org/web/2024/https://mathieuacher.com/services.html))
"""

juries = """
- Reviewer (*rapporteur*): Younoussa Sow (Université de Lille, 2026), Salman Farhat (Université de Lille, 2024), Corentin Latappy (Université de Bordeaux, 2024)
- President: Élodie Germani (Université de Rennes, 2024), Adrien Gougeon (Université de Rennes, 2023)
- Examiner: César Soto Valero (KTH, 2023)
- Prize committees: SIF PhD thesis prize (2022), Gilles Kahn PhD thesis prize (2021); jury of the *Agrégation d'informatique* (2022)
- Full record on [theses.fr](https://theses.fr/158563913)
"""

reviewing = """
IEEE Transactions on Software Engineering (TSE), ACM Computing Surveys, IEEE Software, Information and Software Technology (IST), Science of Computer Programming (SCP), Automated Software Engineering, Journal of Systems and Software (JSS), Software and Systems Modeling (SoSyM), STTT, and others. Guest editor of the JSS special issue on systems and software product line engineering (2019, with Myra B. Cohen).
"""

