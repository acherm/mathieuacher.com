summary = """
I supervise PhD students, postdocs, and engineers in the DiverSE team, on variability, machine learning and LLMs for software engineering, reproducibility, and testing, often with industrial partners (CGI France, Sopra Steria, Nokia, Mitsubishi Electric, Airbus). I serve the software product line and variability community (SPLC, VaMoS, and VARIABILITY steering committees, VaMoS 2025 general chair), co-lead the Inria challenge LLM4Code and the Inria–Simula associate team RIPOST, and am strongly involved in the Inria–Mitsubishi Electric challenge FRAIME and the France 2030 project CodeCommons.
"""

committees = """
- **2026**: VARIABILITY (research papers)
- **2025**: ECAI, SPLC (main and challenge tracks), MODEVAR
- **2024**: [ECAI](https://www.ecai2024.eu/committees/pc), SPLC, MODEVAR (also keynote at MODEVAR@VaMoS)
- **2023**: SPLC, VaMoS
- **2022**: MODEVAR
- **2021**: SPLC, VaMoS
- **2020**: ICSE (SEIP), SPLC, MODELS (doctoral symposium)
- **2019**: SPLC (research, demos and tools), VaMoS, ASE (journal first)
- **Earlier**: ASE 2018, ICSE NIER 2014, 2015, 2018, ICSE SEIP 2014, ICSR 2018, SPLC 2014–2018, VaMoS 2016–2018, SAC SE 2015–2018, SEAA, FOSD, REVE, and others ([full list until 2019](https://web.archive.org/web/2024/https://mathieuacher.com/services.html))
"""

reviewing = """
IEEE Transactions on Software Engineering (TSE), ACM Computing Surveys, IEEE Software, Information and Software Technology (IST), Science of Computer Programming (SCP), Automated Software Engineering, Journal of Systems and Software (JSS), Software and Systems Modeling (SoSyM), STTT, and others. Guest editor of the JSS special issue on systems and software product line engineering (2019, with Myra B. Cohen).

Expertise: member of the ANR evaluation committee "Machine Learning Operations, Génie Logiciel pour l'IA" (2024).
"""

