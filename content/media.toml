# Outreach and media (rendered on the home page, #outreach). Most recent first.
#   date = "YYYY" or "YYYY-MM";  kind = "exhibition" | "video" | "channel" | "book" | "press" | "blog"
#   title, outlet, url (optional), text (Markdown, optional)
# Talks for the general public are in talks.toml (kind = "outreach").

intro = """
I joined the IUF in 2021 on its then-new chair in science outreach (*Médiation scientifique*). Chess is my main way in: everyone knows the game, its rules give an objective referee, and it lets anyone check, rather than take on faith, what generative AI can and cannot do. My [blog](https://blog.mathieuacher.com) publishes these experiments with code and data.
"""

